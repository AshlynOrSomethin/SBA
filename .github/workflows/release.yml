name: Build and Release SBA

on:
  push:
    branches: [ release ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Read SBA_VERSION from gradle.properties
        id: version
        run: |
          VALUE=$(grep '^SBA_VERSION=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Build with Gradle
        run: ./gradlew
        env:
          OPTIMIZE_FOR_CI_CD: "1"
          BUILD_NUMBER: ${{ github.run_id }}
          GITHUB_ACTIONS_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GITHUB_COMMIT_MESSAGE: "${{ github.event.head_commit.message }}"

      - name: Stage release artifact
        run: |
          mkdir -p release-assets
          cp "plugin/build/libs/SBA-${{ steps.version.outputs.value }}-all.jar" \
             "release-assets/SBA-${{ steps.version.outputs.value }}.jar"
          cp LICENSE release-assets/LICENSE

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SBA-${{ steps.version.outputs.value }}
          path: release-assets/*

      - name: Create / Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: SBA ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/SBA-${{ steps.version.outputs.value }}.jar
            release-assets/LICENSE
